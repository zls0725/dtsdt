# ============================================================
# dtsdt.com —— Hugo + PaperMod 配置（中英双语）
# 中文在根目录，英文在 /en/。改完执行 ./deploy.sh 上线。
# ============================================================

baseURL = "https://dtsdt.com/"
title = "dtsdt.com"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false   # 中文不放进 /zh/，老 URL 才能对上
hasCJKLanguage = true                    # 中文按字计字数，阅读时长才准
timeZone = "Asia/Hong_Kong"
theme = "PaperMod"
summaryLength = 60
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true           # lastmod 取 git 提交时间，SEO 的"更新及时"

[pagination]
  pagerSize = 20

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]
  date = ["date", "publishDate", "lastmod"]

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# ---------- 两种语言共用的外观 / 结构 ----------
[params]
  env = "production"
  author = "dtsdt"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  mainSections = ["article"]
  ShowReadingTime = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  ShowAllPagesInArchive = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  hideFooter = false

  [params.assets]
    favicon = "/favicon.ico"
    disableFingerprinting = false

  [params.schema]
    publisherType = "Person"
    sameAs = ["https://github.com/zls0725"]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 200
    threshold = 0.3
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

# ---------- 语言 ----------
[languages]
  # ===== 中文（默认，根目录）=====
  [languages.zh-cn]
    locale = "zh-CN"
    title = "dtsdt.com"
    contentDir = "content/zh"
    weight = 1
    [languages.zh-cn.params]
      description = "dtsdt 的个人网站：文章、笔记与项目记录。"
      keywords = ["dtsdt", "博客", "笔记"]
      [languages.zh-cn.params.homeInfoParams]
        Title = "dtsdt"
        Content = "这里记录我的文章与笔记。站点已从 Notion 迁到 Hugo：打开更快、SEO 更完整、发文章更省事。"
      [languages.zh-cn.params.hub]
        name = "香港 Henry"
        tagline = "聊金融 · 玩科技 · 观全球 · 享自由。这里是我的官网入口，内容都在下面这些地方。"
    [[languages.zh-cn.menus.main]]
      name = "文章"
      url = "/article/"
      weight = 10
    [[languages.zh-cn.menus.main]]
      name = "归档"
      url = "/archives/"
      weight = 20
    [[languages.zh-cn.menus.main]]
      name = "标签"
      url = "/tags/"
      weight = 30
    [[languages.zh-cn.menus.main]]
      name = "搜索"
      url = "/search/"
      weight = 40
    [[languages.zh-cn.menus.main]]
      name = "关于"
      url = "/about/"
      weight = 50

  # ===== 英文（/en/）=====
  [languages.en]
    locale = "en-US"
    title = "dtsdt.com"
    contentDir = "content/en"
    weight = 2
    [languages.en.params]
      description = "dtsdt's personal site: articles, notes and project logs."
      keywords = ["dtsdt", "blog", "notes"]
      [languages.en.params.homeInfoParams]
        Title = "dtsdt"
        Content = "Articles and notes. The site was rebuilt with Hugo: faster pages, complete SEO, simpler publishing."
      [languages.en.params.hub]
        name = "Hong Kong Henry"
        tagline = "Finance · Tech · Global · Freedom. This is my official hub — everything lives in the links below."
    [[languages.en.menus.main]]
      name = "Articles"
      url = "/en/article/"
      weight = 10
    [[languages.en.menus.main]]
      name = "Archive"
      url = "/en/archives/"
      weight = 20
    [[languages.en.menus.main]]
      name = "Tags"
      url = "/en/tags/"
      weight = 30
    [[languages.en.menus.main]]
      name = "Search"
      url = "/en/search/"
      weight = 40
    [[languages.en.menus.main]]
      name = "About"
      url = "/en/about/"
      weight = 50

# ---------- Markdown / 代码高亮 ----------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    anchorLineNos = false

# ---------- 站点地图 ----------
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
